apply plugin: 'jacoco'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.github.mgsx-dev.gdx-gltf:gltf:$gdxGltfVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  api "com.github.crykn:kryonet:2.22.9"

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets.test.resources.srcDirs += [ rootProject.file('assets').path ]

test {
  useJUnitPlatform()
  systemProperty 'assets.dir', rootProject.file('assets').absolutePath
  // A finalizer runs even when a test fails: the coverage report is written after every test run
  finalizedBy jacocoTestReport
}

// Test coverage report, written by ./gradlew core:test (output in core/build/reports/jacoco/test/html).
// No dependsOn test: a finalizer that depends on the failed task would be skipped.
jacocoTestReport {
  reports {
    html.required = true
    xml.required = false
    csv.required = false
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Runs the game server alone (no window): ./gradlew core:runServer
tasks.register('runServer', JavaExec) {
  classpath = sourceSets.main.runtimeClasspath + files(rootProject.file('assets'))
  mainClass = 'io.github.game2d.server.ServerLauncher'
  workingDir = rootProject.projectDir
}

// HTML documentation of the code: ./gradlew core:javadoc (output in core/build/docs/javadoc)
javadoc {
  options.encoding = 'UTF-8'
  options.addStringOption('Xdoclint:all,-missing', '-quiet')
  options.addBooleanOption('html5', true)
  options.windowTitle = '2DGame'
  options.docTitle = '2DGame'
}
